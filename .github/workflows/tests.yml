name: tests

# The Python suite, on both platforms. `deploy.yml` builds and publishes the
# frontend and reads no Python at all.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    # Both platforms: Modules/utilities.py composes paths with pathlib, so
    # the suite discriminates on each. No audio library is installed: every
    # test replaces sounddevice, and the API imports it only to record. The
    # `local` tests open the machine's own audio -- on Linux through a
    # PulseAudio server, which no hosted runner has -- and run on a person's
    # machine, so the runners deselect them.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --frozen: the lock changes only when a dependency edit calls for it,
      # never as a side effect of a run. This also installs torch and the CUDA
      # subtree, which openai-whisper pulls in and which is the bulk of the
      # wall-clock here.
      - name: Install through the lock
        run: uv sync --frozen

      - name: Run the suite
        run: uv run --frozen pytest tests/ -q -m "not local"

  # The Playwright specs under tests/e2e/ run in e2e.yml on the same
  # triggers as this suite; playwright.config.js starts the dev server
  # itself, which is why they need no server step here.
