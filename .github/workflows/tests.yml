name: tests

# The Python suite ran nowhere until this existed. The application and the
# only workflow reaching it lived on two branches that diverged on
# 2024-04-19 and were reconciled on 2026-09-27; `deploy.yml` builds and
# publishes the frontend and reads no Python at all.
#
# Every figure the suite has produced was produced on one Windows
# workstation. This is the first time it runs anywhere else.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --frozen, per the commit that regenerated the lock: it changes only
      # when a dependency edit calls for it, never as a side effect of a run.
      # This step also installs torch and the CUDA subtree, which arrived with
      # openai-whisper and is the bulk of the wall-clock here.
      - name: Install through the lock
        run: uv sync --frozen

      - name: Run the suite
        run: uv run --frozen pytest tests/ -q

  # The Playwright specs under tests/e2e/ are not run here: they need browser
  # binaries and a live server, and neither is set up. Naming the gap rather
  # than leaving the directory looking covered.
