name: tests

# The Python suite ran nowhere until this existed. The application and the
# only workflow reaching it lived on two branches that diverged on
# 2024-04-19 and were reconciled on 2026-09-27; `deploy.yml` builds and
# publishes the frontend and reads no Python at all.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    # Both platforms: Modules/utilities.py composes paths with pathlib, so
    # the suite discriminates on each. Linux needs `libportaudio2` because
    # sounddevice binds the native PortAudio library, its Windows wheel
    # bundles it and its Linux wheel does not, and capture.py imports
    # sounddevice at module scope while api.py imports capture -- without
    # it both API test modules fail at collection before a single test runs.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Native audio library
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      # --frozen, per the commit that regenerated the lock: it changes only
      # when a dependency edit calls for it, never as a side effect of a run.
      # This also installs torch and the CUDA subtree, which arrived with
      # openai-whisper and is the bulk of the wall-clock here.
      - name: Install through the lock
        run: uv sync --frozen

      - name: Run the suite
        run: uv run --frozen pytest tests/ -q

  # The Playwright specs under tests/e2e/ run on demand in e2e.yml: they
  # need a live server the workflow does not yet start, so a dispatch is
  # expected red. Red on demand beats a directory that only looks covered.
