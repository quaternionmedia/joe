name: e2e

# The Playwright specs. playwright.config.js starts the dev server itself
# through its webServer block, so the specs need no server step and run
# wherever Playwright runs, on the same triggers as the Python suite.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run the specs
        run: npm run test:e2e
