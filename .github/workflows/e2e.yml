name: e2e

# The Playwright specs, runnable on demand. This workflow exists so the gap
# has a check that can fail rather than a directory that looks covered: it
# was dispatched and watched going red on 2026-09-27, because the specs need
# a live server nothing here starts yet. When the server step lands, the
# trigger can widen.

on: workflow_dispatch

jobs:
  playwright:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run the specs
        run: npm run test:e2e
