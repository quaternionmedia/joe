name: 🏭 Build and Deploy to GitHub Pages

# The page is built on every PR into main, so a PR shows whether it builds,
# and published to gh-pages only from main: a push to it, or a run by hand on
# it. A PR's build is never published. The build runs the project's npm
# scripts and its dependencies' with a read-only token; only the publish,
# which runs none of them, can write.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 🛠️ Install and Build
        run: |
          npm ci
          npm run build

      - name: 📦 Keep the build for the publish
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency: gh-pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v4

      - name: 📦 The build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: 🚀 Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
