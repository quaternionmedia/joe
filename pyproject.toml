[project]
name = "joe"
version = "0.1.0"
description = "Audio Workbench - inspired by and named after Joeseph Fourier"
authors = [
    {name = "Peter Kagstrom", email = "peter.kagstrom@gmail.com"},
]
dependencies = [
    "librosa",
    "matplotlib",
    "music21",
    "pytest",
    "pytest-sugar",
    "nox",
    "numpy",
    "scipy",
    "spacy",
    "openai-whisper",
    "sounddevice",
    "fastapi",
    "uvicorn[standard]",
    "typer",
]
requires-python = "==3.11.*"
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
joe = "cli:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli", "api"]

# Without this, only cli.py/api.py themselves get installed — Modules/ (the
# actual analysis package they both import) is left out of the wheel, so the
# installed console script fails with ModuleNotFoundError while `uv run
# python -m uvicorn api:app` from the repo root happens to work (cwd puts
# Modules/ on sys.path there, masking the gap).
[tool.setuptools.packages.find]
include = ["Modules*"]

[tool.pdm]
distribution = true
